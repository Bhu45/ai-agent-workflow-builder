table:
  name: organization_usage_summary
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - quota_used
        - quota_limit
        - remaining_quota
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

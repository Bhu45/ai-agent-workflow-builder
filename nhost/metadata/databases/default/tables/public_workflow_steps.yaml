table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - position
        - type
        - config
        - created_at
        - updated_at

      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: "owner" }
          - _and:
              - type: { _in: ["llm_call", "http_request", "conditional_branch", "approval_gate"] }
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: "editor" }
      columns:
        - workflow_id
        - position
        - type
        - config
update_permissions:
  - role: user
    permission:
      columns:
        - position
        - type
        - config
      filter:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: "owner" }
          - _and:
              - type: { _in: ["llm_call", "http_request", "conditional_branch", "approval_gate"] }
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: "editor" }
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: "owner" }
          - _and:
              - type: { _in: ["llm_call", "http_request", "conditional_branch", "approval_gate"] }
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: "editor" }

type Mutation {
  triggerWorkflowRun (
    workflow_id: uuid!
    initial_input: jsonb
  ): TriggerWorkflowRunOutput

  approveStep (
    workflow_run_id: uuid!
    approved: Boolean!
  ): ApproveStepOutput

  createOrganization (
    name: String!
  ): CreateOrganizationOutput
}

type TriggerWorkflowRunOutput {
  run_id: uuid!
  status: String!
}

type ApproveStepOutput {
  run_id: uuid!
  status: String!
}

type CreateOrganizationOutput {
  id: uuid!
}
